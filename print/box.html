<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Переносной ящик для голосования</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap" />
<style>
  @page { size: A4; margin: 0; }
  :root { --paper: #faf8f3; --ink: #1b1d24; --muted: #5f6270; --accent: #23306b; --violet: #5b3fa8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet {
    position: relative;
    width: 210mm; height: 297mm;
    padding: 16mm 18mm;
    display: flex; flex-direction: column; text-align: center;
    font-family: 'PT Sans', sans-serif;
  }
  header { position: relative; border-top: 4px double var(--ink); border-bottom: 4px double var(--ink); padding: 7mm 0 6mm; }
  .sky { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--accent); stroke: var(--accent); opacity: 0.09; }
  .sky polyline { fill: none; stroke-width: 1; }
  .sky path, .sky .stars { stroke: none; }
  .commission { margin: 0; font-family: 'PT Serif', serif; font-weight: 700; font-size: 17pt; letter-spacing: 0.14em; text-transform: uppercase; }
  .precinct { margin: 2mm 0 0; font-size: 15pt; color: var(--muted); }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0; font-family: 'PT Serif', serif; font-weight: 700; font-size: 50pt; line-height: 1.12; letter-spacing: 0.02em; text-transform: uppercase; }
  .rules { margin: 12mm auto 0; font-size: 21pt; line-height: 1.45; max-width: 174mm; }
  .rules p { margin: 0; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 10mm; border-top: 4px double var(--ink); padding-top: 8mm; }
  .qr { display: flex; align-items: center; gap: 6mm; text-align: left; }
  .qr svg { width: 52mm; height: 52mm; display: block; }
  .qr-caption { font-size: 16pt; line-height: 1.3; }
  .qr-caption small { display: block; margin-top: 2mm; font-size: 11pt; color: var(--muted); }
  .seal-box { position: relative; flex: none; }
  .mp { position: absolute; top: -2mm; left: -4mm; font-size: 11pt; color: var(--muted); }
  .seal { width: 46mm; height: 46mm; transform: rotate(-12deg); fill: none; stroke: var(--violet); stroke-width: 2; opacity: 0.85; }
  .seal text { fill: var(--violet); stroke: none; font-family: 'PT Sans', sans-serif; font-size: 9.2px; font-weight: 700; letter-spacing: 0.5px; }
  .seal .seal-mark { font-size: 26px; }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <svg class="sky" viewBox="0 0 400 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M352 12a30 30 0 1 0 27 44a24 24 0 1 1 -27 -44z" />
      <g class="stars"><circle cx="30" cy="30" r="2"/><circle cx="70" cy="16" r="1.5"/><circle cx="100" cy="44" r="1.8"/>
      <circle cx="140" cy="22" r="1.3"/><circle cx="180" cy="52" r="2.2"/><circle cx="220" cy="28" r="1.5"/></g>
      <polyline points="30,30 70,16 100,44 140,22 180,52 220,28" />
    </svg>
    <p class="commission">Астральная избирательная комиссия</p>
    <p class="precinct">Участок № 31 «Канун Дня всех святых»</p>
  </header>

  <main>
    <h1>Переносной<br />ящик<br />для голосования</h1>
    <div class="rules">
      <p>Голосование тайное.</p>
      <p>Избиратель вправе голосовать по любому вопросу.</p>
    </div>
  </main>

  <footer>

      <div class="qr-caption">Итоги<br />волеизъявления<small>career200.github.io/vote-2026</small></div>
    </div>
    <div class="seal-box">
      <span class="mp">М.П.</span>
      <svg class="seal" viewBox="0 0 120 120" aria-hidden="true">
        <defs><path id="ring" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0" /></defs>
        <circle cx="60" cy="60" r="56" /><circle cx="60" cy="60" r="34" />
        <text><textPath href="#ring">АСТРАЛЬНАЯ ИЗБИРАТЕЛЬНАЯ КОМИССИЯ • УЧАСТОК № 31 •</textPath></text>
        <text class="seal-mark" x="60" y="70" text-anchor="middle">☾✦</text>
      </svg>
    </div>
  </footer>
</div>
</body>
</html>
